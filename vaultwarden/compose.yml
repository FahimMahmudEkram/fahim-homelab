services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    environment:
      DOMAIN: "https://homelab.example"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      ENABLE_WEBSOCKET: "true"

    volumes:
      - ./data:/data

    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
